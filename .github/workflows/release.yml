name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  MSRV_VERSION: "1.88"
  RUST_VERSION: 1.98.1

jobs:
  prepare:
    name: Prepare release context
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      crate-version: ${{ steps.version.outputs.crate-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust MSRV
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.MSRV_VERSION }}

      - name: Resolve and validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          crate_version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "keyhold") | .version')
          release_tag="v$crate_version"
          if [ "$EVENT_NAME" = push ]; then
            if [ "$REF_NAME" != "$release_tag" ]; then
              echo "error: release tag $REF_NAME does not match Cargo version $crate_version" >&2
              exit 1
            fi
            release_tag=$REF_NAME
          fi
          echo "crate-version=$crate_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      ARCHIVE_NAME: keyhold-${{ needs.prepare.outputs.release-tag }}-${{ matrix.target }}.tar.gz
      BUILD_IMAGE: ${{ matrix.image }}
      CRATE_VERSION: ${{ needs.prepare.outputs.crate-version }}
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            # quay.io/pypa/manylinux_2_28_x86_64:latest, resolved 2026-09-25.
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:ae21cd1c8220f773f9b5934f3b845d677494d4cd4b8981c1e416f654e8afa74e
            libc: gnu
            arch: x86_64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            # quay.io/pypa/musllinux_1_2_x86_64:latest, resolved 2026-09-25.
            image: quay.io/pypa/musllinux_1_2_x86_64@sha256:ca10ffd4cf35119f7ed600e3691207291de1cfe7a19bb6d77ec7a1e2784e56b3
            libc: musl
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            # quay.io/pypa/manylinux_2_28_aarch64:latest, resolved 2026-09-25.
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:f2c063e4d418c18356490aa38ebd045a8e27a6e3e1f2284dd1fd62da1218789d
            libc: gnu
            arch: aarch64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            # quay.io/pypa/musllinux_1_2_aarch64:latest, resolved 2026-09-25.
            image: quay.io/pypa/musllinux_1_2_aarch64@sha256:53527fed75a049309c32b698cbf0d7a26af1b8208816d42d0061e57d0f382c6f
            libc: musl
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in controlled libc container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env RUST_VERSION \
            --env TARGET \
            "$BUILD_IMAGE" \
            /bin/bash -ceu '
              export CARGO_HOME=/tmp/keyhold-cargo
              export RUSTUP_HOME=/tmp/keyhold-rustup
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$RUST_VERSION"
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup target add "$TARGET"
              cargo build --release --locked --target "$TARGET"
            '

      - name: Verify ELF compatibility
        env:
          ARCH: ${{ matrix.arch }}
          LIBC: ${{ matrix.libc }}
        run: scripts/verify-release-binary.sh "$LIBC" "$ARCH" "target/$TARGET/release/keyhold"

      - name: Smoke-test version output
        run: |
          output=$("target/$TARGET/release/keyhold" --version)
          expected="keyhold $CRATE_VERSION"
          if [ "$output" != "$expected" ]; then
            echo "error: expected '$expected', got '$output'" >&2
            exit 1
          fi

      - name: Package archive and checksum
        run: |
          archive_root="$RUNNER_TEMP/keyhold-release"
          mkdir -p "$archive_root"
          install -m 755 "target/$TARGET/release/keyhold" "$archive_root/keyhold"
          cp LICENSE.txt README.md "$archive_root/"
          tar -czf "$ARCHIVE_NAME" -C "$archive_root" keyhold LICENSE.txt README.md
          sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish immutable release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the draft release and upload its assets.
      id-token: write # Mint the Sigstore signing identity.
      attestations: write # Store build provenance in GitHub.
      artifact-metadata: write # Record attested artifact metadata.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.prepare.outputs.release-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete release asset set
        run: |
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            aarch64-unknown-linux-musl
          do
            archive="keyhold-$TAG_NAME-$target.tar.gz"
            test -s "dist/$archive" || {
              echo "error: missing or empty release asset: $archive" >&2
              exit 1
            }
            test -s "dist/$archive.sha256" || {
              echo "error: missing or empty release asset: $archive.sha256" >&2
              exit 1
            }
            (cd dist && sha256sum -c "$archive.sha256")
          done

      - name: Create or validate draft release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          if release=$(gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" 2>/dev/null); then
            draft=$(printf '%s' "$release" | jq -r .draft)
            immutable=$(printf '%s' "$release" | jq -r '.immutable // false')
            if [ "$draft" != true ] || [ "$immutable" = true ]; then
              echo "error: release $TAG_NAME is already published and cannot be changed" >&2
              exit 1
            fi
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --draft \
              --title "$TAG_NAME" \
              --generate-notes
          fi

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload all draft release assets
        run: gh release upload "$TAG_NAME" dist/* --clobber

      - name: Verify uploaded asset set
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          expected="$RUNNER_TEMP/expected-assets"
          actual="$RUNNER_TEMP/actual-assets"
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            aarch64-unknown-linux-musl
          do
            echo "keyhold-$TAG_NAME-$target.tar.gz"
            echo "keyhold-$TAG_NAME-$target.tar.gz.sha256"
          done | sort > "$expected"
          gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" \
            --jq '.assets[] | select(.size > 0) | .name' | sort > "$actual"
          diff -u "$expected" "$actual"

      - name: Publish release
        run: gh release edit "$TAG_NAME" --draft=false

      - name: Require immutable published release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          immutable=$(gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" --jq '.immutable')
          if [ "$immutable" != true ]; then
            echo "error: GitHub release immutability must be enabled for this repository" >&2
            exit 1
          fi
