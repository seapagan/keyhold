name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  RUST_VERSION: 1.98.1

jobs:
  build:
    name: Build ${{ matrix.binary_target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to create releases and upload assets.
    env:
      BINARY_NAME: keyhold
      # Version tags already carry the leading "v" (e.g. v0.1.0), so the
      # archive name must not add another. Both the packaging and the upload
      # steps use this single definition.
      ARCHIVE_NAME: ${{ format('{0}-{1}-{2}.tar.gz', 'keyhold', github.ref_name, matrix.binary_target) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary_target: x86_64-unknown-linux-gnu
            use-cross: false
          - binary_target: aarch64-unknown-linux-gnu
            use-cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cross@0.2.5

      - name: Add target
        env:
          BINARY_TARGET: ${{ matrix.binary_target }}
        run: rustup target add "$BINARY_TARGET"

      - name: Build binary
        env:
          BINARY_TARGET: ${{ matrix.binary_target }}
          USE_CROSS: ${{ matrix.use-cross }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross build --release --locked --target "$BINARY_TARGET"
          else
            cargo build --release --locked --target "$BINARY_TARGET"
          fi

      - name: Package archive
        env:
          BINARY_TARGET: ${{ matrix.binary_target }}
        run: |
          archive_root="${RUNNER_TEMP:?}/keyhold-release"
          mkdir -p "$archive_root"
          cp "target/$BINARY_TARGET/release/$BINARY_NAME" "$archive_root/"
          cp LICENSE.txt README.md "$archive_root/"
          tar -czf "$ARCHIVE_NAME" -C "$archive_root" .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes || gh release view "$TAG_NAME"
          fi
          gh release upload "$TAG_NAME" "$ARCHIVE_NAME" --clobber
