[package]
name = "keyhold"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Temporarily keep a GPG private key cached in gpg-agent while you explicitly allow it"
license = "MIT"
repository = "https://github.com/seapagan/keyhold"
keywords = ["gpg", "gnupg", "gpg-agent", "cache", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "LICENSE.txt", "README.md", "CHANGELOG.md"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
colored_text = "0.5.1"
humantime = "2.4.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
thiserror = "2.0.20"
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde"] }
rpassword = "7.5.4"
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
zeroize = "1.9.0"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
