[package]
name = "keyhold"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Temporarily keep a GPG private key cached in gpg-agent while you explicitly allow it"
repository = "https://github.com/seapagan/keyhold"
license = "MIT"
keywords = ["cache", "cli", "gnupg", "gpg", "gpg-agent"]
categories = ["command-line-utilities"]
include = ["CHANGELOG.md", "LICENSE.txt", "README.md", "src/**", "tests/**"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
colored_text = "0.5.1"
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
humantime = "2.4.0"
libc = "0.2.189"
rpassword = "7.5.4"
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
thiserror = "2.0.20"
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde"] }
zeroize = "1.9.0"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "deny"
