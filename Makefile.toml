[env]
MSRV_VERSION = "1.88"
COMPLEXITY_LIZARD_VERSION = { value = "1.23.0", condition = { env_not_set = ["COMPLEXITY_LIZARD_VERSION"] } }
COMPLEXITY_MAX_CCN = { value = "10", condition = { env_not_set = ["COMPLEXITY_MAX_CCN"] } }
COMPLEXITY_MAX_FUNCTION_NLOC = { value = "50", condition = { env_not_set = ["COMPLEXITY_MAX_FUNCTION_NLOC"] } }
COMPLEXITY_MAX_PARAMETERS = { value = "8", condition = { env_not_set = ["COMPLEXITY_MAX_PARAMETERS"] } }
COMPLEXITY_MAX_FILE_NLOC = { value = "500", condition = { env_not_set = ["COMPLEXITY_MAX_FILE_NLOC"] } }

[tasks.format]
description = "Check Rust formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.python-format]
description = "Check Python support-code formatting"
condition_script = ["ruff --version"]
command = "ruff"
args = ["format", "--check", "."]

[tasks.python-lint]
description = "Lint Python support code"
condition_script = ["ruff --version"]
command = "ruff"
args = ["check", "."]

[tasks.python-type]
description = "Type-check Python support code strictly"
condition_script = ["mypy --version"]
command = "mypy"
args = ["--strict", "--exclude-gitignore", "."]

[tasks.python-test]
description = "Test Python support code"
condition_script = ['python3 -c "import sys; raise SystemExit(sys.version_info < (3, 10))"']
command = "python3"
args = ["-B", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"]

[tasks.python-test.windows]
condition_script = ['python -c "import sys; raise SystemExit(sys.version_info < (3, 10))"']
command = "python"

[tasks.complexity]
description = "Report Codacy-aligned Rust and Python complexity findings without failing verification"
condition_script = ['python3 -c "import sys; raise SystemExit(sys.version_info < (3, 10))" && lizard --version']
command = "python3"
args = ["scripts/check_complexity.py"]

[tasks.complexity.windows]
condition_script = ['python -c "import sys; raise SystemExit(sys.version_info < (3, 10))" && lizard --version']
command = "python"

[tasks.check]
description = "Check all targets and features"
command = "cargo"
args = ["check", "--all-targets", "--all-features", "--locked"]

[tasks.clippy]
description = "Run Clippy with warnings denied"
command = "cargo"
args = [
  "clippy",
  "--all-targets",
  "--all-features",
  "--locked",
  "--",
  "-D",
  "warnings",
]

[tasks.test]
description = "Run the test suite with cargo-nextest"
command = "cargo"
args = ["nextest", "run", "--all-targets", "--all-features", "--locked"]

[tasks.doc]
description = "Build documentation with rustdoc warnings denied"
env = { "RUSTDOCFLAGS" = "-D warnings" }
command = "cargo"
args = ["doc", "--no-deps"]

[tasks.build]
description = "Build all targets and features"
command = "cargo"
args = ["build", "--all-targets", "--all-features", "--locked"]

[tasks.release]
description = "Build the optimized release binary"
command = "cargo"
args = ["build", "--release", "--locked"]

[tasks.package]
description = "Verify the crate packages cleanly"
command = "cargo"
args = ["package", "--locked"]

[tasks.msrv-check]
private = true
install_crate = false
command = "cargo"
args = [
  "+${MSRV_VERSION}",
  "check",
  "--all-targets",
  "--all-features",
  "--locked",
]

[tasks.msrv]
description = "Check against the minimum supported Rust version"
dependencies = ["msrv-check"]

[tasks.audit]
description = "Audit dependencies for known vulnerabilities (cargo audit)"
command = "cargo"
args = ["audit"]

[tasks.shellcheck-present]
private = true
command = "shellcheck"
args = ["--version"]

[tasks.installers-shellcheck]
description = "Check maintained shell scripts with ShellCheck"
dependencies = ["shellcheck-present"]
command = "shellcheck"
args = [
  "install.sh",
  "scripts/verify-release-binary.sh",
  "tests/installers/unix.sh",
  "tests/release/verify.sh",
]

[tasks.unix-installer-test]
description = "Test the Unix installer with local release archives"
command = "sh"
args = ["tests/installers/unix.sh"]

[tasks.release-verification-test]
description = "Test the release ELF verification helper"
command = "sh"
args = ["tests/release/verify.sh"]

[tasks.actions-lint]
description = "Validate GitHub Actions workflow syntax"
command = "actionlint"

[tasks.zizmor]
description = "Audit GitHub Actions workflows with the pedantic persona"
command = "zizmor"
args = ["--persona=pedantic", ".github/workflows"]

[tasks.prepare-coverage]
private = true
script_runner = "@duckscript"
script = ["mkdir target/llvm-cov"]

[tasks.coverage]
# `clear` replaces cargo-make's built-in coverage task instead of merging
# with it (the merge would combine incompatible action types).
clear = true
description = "Run tests and write repository-relative LCOV coverage"
# Requires cargo-nextest and cargo-llvm-cov.
dependencies = ["prepare-coverage"]
command = "cargo"
args = [
  "llvm-cov",
  "nextest",
  "--all-targets",
  "--all-features",
  "--locked",
  "--no-fail-fast",
  "--remap-path-prefix",
  "--lcov",
  "--output-path=target/llvm-cov/coverage.lcov",
]

[tasks.coverage-html]
description = "Run tests and generate a local HTML report (target/llvm-cov/html)"
# Requires cargo-nextest and cargo-llvm-cov.
command = "cargo"
args = [
  "llvm-cov",
  "nextest",
  "--all-targets",
  "--all-features",
  "--locked",
  "--no-fail-fast",
  "--remap-path-prefix",
  "--html",
]

[tasks.changelog]
description = "Update CHANGELOG.md with the latest merged PRs and closed issues"
command = "github-changelog-md"
args = ["${@}"]

[tasks.verify]
description = "Run the full local verification gate"
dependencies = [
  "format",
  "python-format",
  "python-lint",
  "python-type",
  "python-test",
  "complexity",
  "check",
  "clippy",
  "test",
  "doc",
  "release",
  "package",
  "msrv",
  "installers-shellcheck",
  "unix-installer-test",
  "release-verification-test",
  "actions-lint",
  "zizmor",
]
